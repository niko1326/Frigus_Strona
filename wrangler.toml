name = "frigac-strona"
main = "worker/panel-auth.mjs"
compatibility_date = "2026-09-05"

[assets]
directory = "./dist"
binding = "ASSETS"
# Authentication must run before HTML aliases or other static assets are served.
run_worker_first = true

# ...
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true
# ...
